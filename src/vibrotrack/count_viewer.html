<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颗粒速查 · 单图计数</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0f141a; --panel:#151d26; --line:#2b3a48; --fg:#e8eef5; --muted:#93a4b2;
    --green:#20d67a; --cyan:#39d5ff; --orange:#ffb02e; --red:#ff5c64;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 system-ui, "Microsoft YaHei", "Segoe UI", sans-serif;
         display:flex; flex-direction:column; overflow:hidden; }
  header { padding:10px 16px 8px; border-bottom:1px solid var(--line); background:#121a22; }
  h1 { font-size:16px; margin:0; font-weight:650; display:flex; gap:8px; align-items:baseline; }
  h1 .tag { font-size:12px; color:var(--muted); font-weight:400; }
  .hint { margin:4px 0 0; color:var(--muted); font-size:12.5px; }
  kbd { background:#24313d; border:1px solid #3b4d5d; border-radius:4px; padding:0 4px; font-size:11.5px; }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
         padding:8px 16px; border-bottom:1px solid var(--line); background:#111922; }
  button { background:var(--panel); color:var(--fg); border:1px solid #3a4c5c; border-radius:7px;
           padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:#5a768c; background:#1b2631; }
  button:disabled { opacity:.42; cursor:default; }
  button.mode.active { background:#174a35; border-color:var(--green); color:#c9ffe2; }
  #status { margin-left:auto; color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; }

  main { flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 252px; }
  #stage { position:relative; min-height:0; overflow:hidden; background:#070b0f; cursor:crosshair; }
  #stage.panning { cursor:grabbing; }
  #canvas { display:block; width:100%; height:100%; }
  [hidden] { display:none !important; }
  select { font:inherit; color:var(--fg); background:var(--panel); padding:6px; border:1px solid #52708e; border-radius:6px; }
  #empty { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; color:var(--muted); pointer-events:none; }
  #stage.dropping { outline:2px dashed #39d5ff; outline-offset:-5px; }
  #groups { display:grid; gap:4px; }
  #groups div { display:flex; justify-content:space-between; gap:8px; }
  #filename { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #status { overflow-wrap:anywhere; }
  #workflow { background:#194638; border-color:#35866b; }

  aside { border-left:1px solid var(--line); background:var(--panel); padding:12px 14px;
          overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .count { display:flex; align-items:baseline; gap:6px; }
  .count span { font-size:44px; line-height:1; font-weight:650; font-variant-numeric:tabular-nums;
                color:var(--green); }
  .count small { color:var(--muted); font-size:13px; }
  .muted { color:var(--muted); }
  .small { font-size:12.5px; }
  #hist { width:100%; height:auto; background:#0d141b; border:1px solid var(--line); border-radius:6px; }
  dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12.5px; }
  dt { color:var(--muted); }
  dd { margin:0; font-variant-numeric:tabular-nums; }
  .help { margin-top:auto; color:var(--muted); font-size:12px; line-height:1.65;
          border-top:1px solid var(--line); padding-top:8px; }
  .help b { color:#cfe4f5; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>颗粒速查 <span class="tag">单张识别 · 本机运行</span></h1>
  <p class="hint">vibrotrack v2 自动计数，校对后可导出标注图；结果不用于正式归档。</p>
</header>

<div class="bar" id="inputBar" hidden>
  <label>粒径模式 <select id="sizeMode">
    <option value="">请选择</option>
    <option value="mono14">14 mm 单分散</option>
    <option value="bi12-14">12 + 14 mm 双分散</option>
  </select></label>
  <input id="file" type="file" accept=".tif,.tiff,.png,.jpg,.jpeg" hidden>
  <button id="workflow">打开图片</button>
  <button id="retry" disabled>按当前模式重算</button>
  <span id="filename" class="muted small"></span>
</div>
<div class="bar">
  <button id="modeView" class="mode active">浏览</button>
  <button id="modeAdd" class="mode">加颗粒</button>
  <label id="addGroupBox" hidden>补点粒径 <select id="addGroup" aria-label="补点粒径"></select></label>
  <button id="undo" disabled>撤销</button>
  <button id="clearManual" disabled>清空手改</button>
  <button id="exportPng" disabled>导出标注图</button>
  <span id="status" role="status">载入中…</span>
</div>

<main>
  <div id="stage"><canvas id="canvas"></canvas><div id="empty">先选粒径，再把一张 TIFF、PNG 或 JPG 拖到这里</div></div>
  <aside>
    <div class="count"><span id="count">—</span><small>颗</small></div>
    <div id="breakdown" class="muted small">—</div>
    <div id="groups" aria-label="分组计数"></div>
    <canvas id="hist" width="224" height="84"></canvas>
    <div id="radiusInfo" class="muted small">半径分布</div>
    <dl>
      <dt>结果模式</dt><dd id="infoMode">—</dd>
      <dt>图片</dt><dd id="infoSize">—</dd>
      <dt>先验</dt><dd id="infoPrior">—</dd>
      <dt>耗时</dt><dd id="infoTime">—</dd>
    </dl>
    <div class="help">
      <b>怎么用</b><br>
      1. 点「加颗粒」后左键补点；右键删除，滚轮缩放、拖拽平移。<br>
      2. <kbd>Ctrl+Z</kbd> 撤销，<kbd>F</kbd> 复位视图，<kbd>A</kbd> 切到加一颗。<br>
      3. 「导出标注图」写出带圈和最终数量的 PNG。<br>
      双分散补点前可以选大或小；拿不准就保留为「未分组」。<br>
      贴壁、遮挡或打光不均时可能漏检，请以人工核对为准。
    </div>
  </aside>
</main>

<script>
'use strict';
const INITIAL = /*__DATA__*/;
const app = INITIAL === null;
let DATA = INITIAL;
const palette = ['#f6be65', '#39d5ff'];

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const ctx = canvas.getContext('2d');

const stage = $('stage');
// The full-resolution frame is kept only for the exported PNG.
let srcImage = null;      // display copy (<=1200 px)
let fullImage = null;     // full resolution, used by the export only
const histCanvas = $('hist');
const histCtx = histCanvas.getContext('2d');

const S = {
  img: null, particles: [], adds: [], ops: [], busy: false, exporting: false,
  view: { s: 1, x: 0, y: 0 }, mode: 'view', hover: null,
};
let drag = null;

function visible() { return S.particles.filter((p) => !p.removed); }
function setStatus(text) { $('status').textContent = text; }

// ---------- image ----------
function decodeDisplay(url) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error('图片载入失败'));
    im.src = url;
  });
}

async function showResult(data) {
  const image = await decodeDisplay(data.image);
  DATA = data;
  srcImage = image;
  fullImage = null;
  S.img = { w: data.width, h: data.height,
            kx: image.naturalWidth / data.width, ky: image.naturalHeight / data.height };
  S.particles = data.particles.map(([x, y, r, group = null]) => ({ x, y, r, group, src:'auto', removed:false }));
  drag = null;
  stage.classList.remove('panning');
  S.adds = []; S.ops = []; S.hover = null;
  const select = $('addGroup');
  select.replaceChildren(...data.meta.groups.map(g => new Option(g.label, g.id)), new Option('未分组', ''));
  select.value = data.meta.groups.length === 1 ? String(data.meta.groups[0].id) : '';
  setMode('view');
  fitView();
  updateUI();
  setStatus('识别完成 · 请核对颗粒位置');
}

function groupColor(p) {
  if ((DATA?.meta.groups.length || 0) > 1) return palette[p.group] || '#cdd7df';
  return p.src === 'manual' ? '#39d5ff' : '#20d67a';
}

// ---------- render ----------
// Retain the accepted render path: decoded <=1200 px copy, one 1:1 canvas,
// original-image coordinates for hit testing and export.
let rafId = 0;

function render() {
  if (rafId) return;
  rafId = requestAnimationFrame(() => { rafId = 0; paint(); });
}

function paint() {
  const cw = stage.clientWidth, ch = stage.clientHeight;
  if (canvas.width !== cw || canvas.height !== ch) {
    canvas.width = cw;
    canvas.height = ch;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#070b0f';
  ctx.fillRect(0, 0, cw, ch);
  if (!S.img) return;

  const v = S.view;
  const W = S.img.w, H = S.img.h;
  const sx0 = Math.max(0, -v.x / v.s), sy0 = Math.max(0, -v.y / v.s);
  const sx1 = Math.min(W, (cw - v.x) / v.s), sy1 = Math.min(H, (ch - v.y) / v.s);
  if (sx1 > sx0 && sy1 > sy0) {
    // Smooth only while shrinking; when enlarged, nearest-neighbour is sharper
    // on the rims and far cheaper per pixel.
    const { kx, ky } = S.img;
    ctx.imageSmoothingEnabled = v.s <= kx;
    ctx.drawImage(srcImage,
                  sx0 * kx, sy0 * ky, (sx1 - sx0) * kx, (sy1 - sy0) * ky,
                  v.x + sx0 * v.s, v.y + sy0 * v.s,
                  (sx1 - sx0) * v.s, (sy1 - sy0) * v.s);

    const pad = 8;
    const vis0x = sx0 - pad, vis0y = sy0 - pad, vis1x = sx1 + pad, vis1y = sy1 + pad;
    const visible = (p) => !(p.x + p.r < vis0x || p.x - p.r > vis1x ||
                             p.y + p.r < vis0y || p.y - p.r > vis1y);
    ctx.lineWidth = 1.4;

    const colors = DATA.meta.groups.length > 1 ? [...palette, '#cdd7df'] : ['#20d67a', '#39d5ff'];
    for (const color of colors) {
      ctx.beginPath();
      for (const p of S.particles) {
        if (p.removed || groupColor(p) !== color || !visible(p)) continue;
        const x = v.x + p.x * v.s, y = v.y + p.y * v.s, r = Math.max(2, p.r * v.s);
        ctx.moveTo(x + r, y);
        ctx.arc(x, y, r, 0, Math.PI * 2);
      }
      ctx.strokeStyle = color;
      ctx.stroke();
    }

    ctx.beginPath();
    for (const p of S.particles) {
      if (!p.removed || !visible(p)) continue;
      const x = v.x + p.x * v.s, y = v.y + p.y * v.s, d = Math.max(3, p.r * v.s * 0.6);
      ctx.moveTo(x - d, y - d);
      ctx.lineTo(x + d, y + d);
      ctx.moveTo(x + d, y - d);
      ctx.lineTo(x - d, y + d);
    }
    ctx.strokeStyle = 'rgba(255,92,100,0.8)';
    ctx.stroke();

    if (S.hover && !S.hover.removed) {
      const x = v.x + S.hover.x * v.s, y = v.y + S.hover.y * v.s;
      const r = Math.max(2, S.hover.r * v.s);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.arc(x, y, r + 3, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffb02e';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function drawHist() {
  const W = histCanvas.width, H = histCanvas.height;
  histCtx.clearRect(0, 0, W, H);
  histCtx.fillStyle = '#0d141b';
  histCtx.fillRect(0, 0, W, H);
  const rs = visible().map((p) => p.r);
  if (!rs.length) return;
  const lo = Math.min(...rs), hi = Math.max(...rs);
  const span = Math.max(0.5, hi - lo);
  const bins = 22;
  const counts = new Array(bins).fill(0);
  for (const r of rs) counts[Math.min(bins - 1, ((r - lo) / span * bins) | 0)]++;
  const maxC = Math.max(...counts);
  const bw = W / bins;
  for (let i = 0; i < bins; i++) {
    const bh = (counts[i] / maxC) * (H - 6);
    histCtx.fillStyle = '#20d67a';
    histCtx.fillRect(i * bw + 0.5, H - bh, Math.max(1, bw - 1), bh);
  }
}

function groupTotals(vis) {
  if (!DATA || (DATA.meta.groups.length < 2 && DATA.meta.mode !== 'bi12-14')) return [];
  const totals = DATA.meta.groups.map(g => ({...g, n:vis.filter(p => p.group === g.id).length}));
  const n = vis.filter(p => p.group === null).length;
  if (n || !totals.length) totals.push({id:null, label:'未分组', n});
  return totals;
}

function updateUI() {
  const vis = visible();
  const nAuto = vis.filter((p) => p.src !== 'manual').length;
  const nMan = vis.length - nAuto;
  const nRem = S.particles.filter((p) => p.removed).length;
  $('count').textContent = S.img ? vis.length : '—';
  $('breakdown').textContent = !S.img ? '—'
    : `自动 ${nAuto} · 手动 +${nMan}` + (nRem ? ` · 已删 ${nRem}` : '');
  if (vis.length) {
    const rs = vis.map((p) => p.r).sort((a, b) => a - b);
    const med = rs[(rs.length / 2) | 0];
    $('radiusInfo').textContent = `半径 中位 ${med.toFixed(1)} px · ${rs[0].toFixed(1)}–${rs[rs.length - 1].toFixed(1)}`;
  } else {
    $('radiusInfo').textContent = '半径分布';
  }
  drawHist();
  $('undo').disabled = !S.ops.length;
  $('clearManual').disabled = !S.adds.length && !S.particles.some((p) => p.removed);
  $('exportPng').disabled = !S.img || S.busy || S.exporting;
  $('modeView').disabled = $('modeAdd').disabled = !S.img || S.busy;
  $('undo').disabled ||= S.busy || S.exporting;
  $('clearManual').disabled ||= S.busy || S.exporting;
  $('empty').hidden = !!S.img;
  $('addGroupBox').hidden = S.mode !== 'add' || (DATA?.meta.groups.length || 0) < 2;
  const summary = groupTotals(vis).map(g => {
    const row = document.createElement('div');
    const label = document.createElement('span');
    const n = document.createElement('strong');
    label.textContent = g.label;
    label.style.color = palette[g.id] || '#cdd7df';
    n.textContent = g.n;
    row.append(label, n);
    return row;
  });
  $('groups').replaceChildren(...summary);
  const m = DATA?.meta;
  $('infoMode').textContent = m?.mode_label || '—';
  $('infoSize').textContent = m ? `${m.width}×${m.height}` : '—';
  $('infoPrior').textContent = m ? (m.neighbours.length ? `${m.neighbours.length} 帧` : '无（单张）') : '—';
  $('infoTime').textContent = m && m.ms ? `${m.ms} ms` : '—';
}

// ---------- view ----------
function fitView() {
  if (!S.img) return;
  const cw = stage.clientWidth, ch = stage.clientHeight;
  const s = Math.min((cw - 16) / S.img.w, (ch - 16) / S.img.h);
  S.view.s = Math.max(0.02, Math.min(8, s));
  S.view.x = (cw - S.img.w * S.view.s) / 2;
  S.view.y = (ch - S.img.h * S.view.s) / 2;
  render();
}

function zoomAt(cx, cy, factor) {
  const v = S.view;
  const ns = Math.max(0.02, Math.min(6, v.s * factor));
  const k = ns / v.s;
  v.x = cx - (cx - v.x) * k;
  v.y = cy - (cy - v.y) * k;
  v.s = ns;
  render();
}

function toImage(ev) {
  const r = stage.getBoundingClientRect();
  return { x: (ev.clientX - r.left - S.view.x) / S.view.s,
           y: (ev.clientY - r.top - S.view.y) / S.view.s };
}

function pick(pt) {
  let best = null, bestD = Infinity;
  for (const p of S.particles) {
    if (p.removed) continue;
    const d = Math.hypot(p.x - pt.x, p.y - pt.y);
    if (d <= Math.max(p.r * 1.05, 5) && d < bestD) { best = p; bestD = d; }
  }
  return best;
}

// ---------- edit ----------
function addAt(ix, iy) {
  if (ix < 0 || iy < 0 || ix >= S.img.w || iy >= S.img.h) return;
  const groups = DATA.meta.groups;
  const g = groups.length === 1 ? groups[0] : groups.find(g => String(g.id) === $('addGroup').value);
  const r = g?.radius || DATA.meta.radius_px || 20;
  const item = { x: ix, y: iy, r, group: g?.id ?? null, src: 'manual', removed: false };
  S.adds.push(item);
  S.particles.push(item);
  S.ops.push(() => {
    const i = S.particles.indexOf(item);
    if (i >= 0) S.particles.splice(i, 1);
    const j = S.adds.indexOf(item);
    if (j >= 0) S.adds.splice(j, 1);
  });
  updateUI();
  render();
}

function removeAt(p) {
  S.hover = null;
  if (p.src === 'manual') {
    const i = S.particles.indexOf(p);
    if (i < 0) return;
    S.particles.splice(i, 1);
    const j = S.adds.indexOf(p);
    if (j >= 0) S.adds.splice(j, 1);
    S.ops.push(() => { S.particles.push(p); S.adds.push(p); });
  } else {
    p.removed = true;
    S.ops.push(() => { p.removed = false; });
  }
  updateUI();
  render();
}

function undo() {
  const fn = S.ops.pop();
  if (!fn) return;
  fn();
  S.hover = null;
  updateUI();
  render();
}

function clearManual() {
  S.particles = S.particles.filter(p => p.src !== 'manual');
  for (const p of S.particles) p.removed = false;
  S.hover = null;
  S.adds = [];
  S.ops = [];
  updateUI();
  render();
}

// ---------- export ----------
async function exportPng() {
  if (!S.img || S.busy || S.exporting) return;
  S.exporting = true;
  updateControls();
  try {
    if (!fullImage) fullImage = DATA.full ? await decodeDisplay(DATA.full) : srcImage;
    await downloadPng();
    setStatus('已生成标注 PNG');
  } catch (err) {
    setStatus('导出失败：' + err.message);
  } finally {
    S.exporting = false;
    updateControls();
  }
}

async function downloadPng() {
  const w = S.img.w, h = S.img.h;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(fullImage || srcImage, 0, 0, w, h);
  const vis = visible();
  const lw = Math.max(2, Math.round(Math.min(w, h) / 900));
  for (const p of vis) {
    g.beginPath();
    g.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    g.strokeStyle = groupColor(p);
    g.lineWidth = lw;
    g.stroke();
  }
  const counts = groupTotals(vis).map(g => `${g.label} ${g.n}`).join(' / ');
  const label = `总数 ${vis.length}  ·  ${DATA.meta.mode_label || '自定义'}` + (counts ? `  ·  ${counts}` : '');
  const fs = Math.max(22, Math.round(w / 45));
  const pad = Math.round(fs * 0.45);
  g.font = `600 ${fs}px system-ui, "Microsoft YaHei", sans-serif`;
  const tw = g.measureText(label).width;
  g.fillStyle = 'rgba(8,12,16,0.72)';
  g.fillRect(0, 0, tw + pad * 2, Math.round(fs * 1.65));
  g.fillStyle = '#e8eef5';
  g.fillText(label, pad, Math.round(fs * 1.18), Math.max(1, w - 2 * pad));
  const name = (DATA.meta.image || 'image').split(/[\\/]/).pop();
  const foot = `${name} · ${new Date().toLocaleString()}`;
  g.font = `400 ${Math.max(14, Math.round(fs * 0.5))}px system-ui, sans-serif`;
  const fw = g.measureText(foot).width;
  const fh = Math.round(Math.max(14, fs * 0.5) * 1.6);
  g.fillStyle = 'rgba(8,12,16,0.62)';
  g.fillRect(0, h - fh, fw + pad * 2, fh);
  g.fillStyle = '#cfe4f5';
  g.fillText(foot, pad, h - Math.round(fh * 0.3));
  const blob = await new Promise(resolve => c.toBlob(resolve, 'image/png'));
  if (!blob) throw new Error('浏览器未能生成 PNG');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name.replace(/\.[^.]+$/, '')}_count${vis.length}.png`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

// ---------- wiring ----------
function setMode(mode) {
  S.mode = mode;
  $('modeView').classList.toggle('active', mode === 'view');
  $('modeAdd').classList.toggle('active', mode === 'add');
  stage.style.cursor = mode === 'add' ? 'copy' : 'crosshair';
  $('addGroupBox').hidden = mode !== 'add' || (DATA?.meta.groups.length || 0) < 2;
}

$('modeView').addEventListener('click', () => setMode('view'));
$('modeAdd').addEventListener('click', () => setMode('add'));
$('undo').addEventListener('click', undo);
$('clearManual').addEventListener('click', clearManual);
$('exportPng').addEventListener('click', exportPng);

stage.addEventListener('mousedown', (ev) => {
  if (!S.img || S.busy || S.exporting) return;
  if (ev.button === 2) {
    const p = pick(toImage(ev));
    if (p) removeAt(p);
    ev.preventDefault();
    return;
  }
  if (ev.button !== 0) return;
  drag = { x: ev.clientX, y: ev.clientY, vx: S.view.x, vy: S.view.y, moved: false };
});

window.addEventListener('mousemove', (ev) => {
  if (drag) {
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) {
      drag.moved = true;
      S.view.x = drag.vx + dx;
      S.view.y = drag.vy + dy;
      stage.classList.add('panning');
      render();
    }
    return;
  }
  if (S.img) {
    const p = pick(toImage(ev));
    if (p !== S.hover) { S.hover = p; render(); }
  }
});

window.addEventListener('mouseup', (ev) => {
  if (!drag) return;
  const moved = drag.moved;
  drag = null;
  stage.classList.remove('panning');
  if (moved || ev.button !== 0 || !S.img) return;
  const pt = toImage(ev);
  if (S.mode === 'add' && !pick(pt)) addAt(pt.x, pt.y);
});

stage.addEventListener('contextmenu', (ev) => ev.preventDefault());
stage.addEventListener('wheel', (ev) => {
  if (!S.img) return;
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0015)));
}, { passive: false });

window.addEventListener('keydown', (ev) => {
  const tag = ev.target && ev.target.tagName;
  if (S.busy || S.exporting || ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag)) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(); }
  else if (ev.key === 'f') fitView();
  else if (ev.key === 'a') setMode('add');
  else if (ev.key === 'Escape') setMode('view');
});

window.addEventListener('resize', render);

let selectedFile = null;
function updateControls() {
  updateUI();
  if (!app) return;
  const locked = S.busy || S.exporting;
  const selected = !!$('sizeMode').value;
  $('sizeMode').disabled = locked;
  $('workflow').disabled = !selected || locked;
  $('retry').disabled = !selectedFile || !selected || locked;
  $('filename').textContent = selectedFile?.name || '';
  $('filename').title = $('filename').textContent;
}

async function detectFile(file) {
  if (!file || S.busy || S.exporting) return;
  const mode = $('sizeMode').value;
  if (!mode) { setStatus('请先选择粒径模式'); return; }
  if (file.size > 64 * 1024 * 1024) { setStatus('图片超过 64 MiB'); return; }
  if (S.ops.length && !window.confirm('检测成功后将替换当前结果和手改，继续？')) return;
  selectedFile = file;
  S.busy = true;
  updateControls();
  setStatus(`正在检测 ${file.name}…`);
  try {
    const query = new URLSearchParams({mode, name:file.name});
    const resp = await fetch(`/detect?${query}`, {
      method:'POST', headers:{'Content-Type':'application/octet-stream'}, body:file,
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || '检测失败');
    await showResult(data);
  } catch (err) {
    setStatus(`未生成新结果：${err.message}` + (S.img ? '；仍显示上一张结果' : ''));
  } finally {
    S.busy = false;
    updateControls();
  }
}

if (app) {
  $('inputBar').hidden = false;
  $('workflow').onclick = () => $('file').click();
  $('retry').onclick = () => detectFile(selectedFile);
  $('sizeMode').onchange = () => {
    updateControls();
    if (DATA && DATA.meta.mode !== $('sizeMode').value) setStatus('模式已切换；按「重算」才会更新当前结果');
  };
  $('file').onchange = ev => { detectFile(ev.target.files[0]); ev.target.value = ''; };
  window.addEventListener('dragover', ev => ev.preventDefault());
  window.addEventListener('drop', ev => ev.preventDefault());
  stage.addEventListener('dragover', ev => { ev.preventDefault(); stage.classList.add('dropping'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('dropping'));
  stage.addEventListener('drop', ev => {
    ev.preventDefault();
    stage.classList.remove('dropping');
    const files = ev.dataTransfer.files;
    if (files.length !== 1) { setStatus('请一次只拖入一张图片'); return; }
    detectFile(files[0]);
  });
  updateControls();
  setStatus('请选择粒径模式');
} else {
  updateControls();
  showResult(INITIAL).catch(err => setStatus('载入失败：' + err.message));
}
</script>
</body>
</html>
